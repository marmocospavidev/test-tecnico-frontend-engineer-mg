[project]
name = "mock-backend"
version = "0.1.0"
description = "Mock Backend for Technical Test"
authors = [
    {name = "Developer", email = "dev@example.com"},
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "python-multipart>=0.0.6",
    "pydantic-settings>=2.0.0",
    "pdf2image>=1.17.0",
    "matplotlib>=3.9.4",
    "pillow>=11.3.0",
    "numpy>=2.0.2",
    "pymupdf>=1.24.0",
]
requires-python = ">=3.9"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
